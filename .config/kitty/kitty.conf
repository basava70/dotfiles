# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_THEME
# Tokyo Night Moon
# include tokyonight-night.conf
include rosepine.conf
# END_KITTY_THEME
# BEGIN_KITTY_FONTS
font_family      family='FiraCode Nerd Font' postscript_name=FiraCodeNF-Reg
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

font_size 14

window_decorations full

background_opacity 1

allow_remote_control yes
forward_stdio yes
